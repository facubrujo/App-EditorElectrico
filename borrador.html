<div class="container mt-4">
                        <!-- Panel de control para agregar circuitos -->
                        <div class="row mb-3 align-items-end">
                            <div class="col-md-4">
                                <label for="tipoCircuito" class="form-label font-weight-bold">Tipo de Circuito:</label>
                                <select id="tipoCircuito" class="form-select">
                                    <option value="IUG">IUG (Iluminación Uso General)</option>
                                    <option value="TUG">TUG (Tomacorrientes Uso General)</option>
                                    <option value="ACU">ACU (Alimentación Carga Única)</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <button id="btnAgregar" class="btn btn-primary w-100">Agregar Circuito</button>
                            </div>
                        </div>

                        <!-- Tabla Dinámica -->
                        <div class="col">
                            <table class="table" id="tablaCircuitos">
                                <thead>
                                    <tr id="filaCabecera">
                                        <th scope="col">CIRCUITOS</th>
                                        <!-- Las columnas dinámicas se insertarán ACÁ -->
                                        <th scope="col" class="col-seccional">SECCIONAL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr id="filaDpms">
                                        <th scope="row">DPMS (VA)</th>
                                        <!-- Datos dinámicos -->
                                        <td id="tuCuadroDeDatos"><input type="number" class="form-control form-control-sm" placeholder="...">
                                        </td>
                                    </tr>
                                    <tr id="filaTension">
                                        <th scope="row">TENSION (V)</th>
                                        <td><input type="number" class="form-control form-control-sm" value="220"></td>
                                    </tr>
                                    <tr id="filaIb">
                                        <th scope="row" data-bs-toggle="tooltip" data-bs-placement="right"
                                            data-bs-title="Corriente Calculada.">Ib (A)</th>
                                        <td id="corrienteCalculada"><input type="number" class="form-control form-control-sm" placeholder="..."
                                                readonly></td>
                                    </tr>
                                    <tr id="filaSeccionLN">
                                        <th scope="row">SECCION L y N (mm2)</th>
                                        <td><input type="number" class="form-control form-control-sm" placeholder="...">
                                        </td>
                                    </tr>
                                    <tr id="filaSeccionPE">
                                        <th scope="row">SECCION DE PE (mm2)</th>
                                        <td><input type="number" class="form-control form-control-sm" placeholder="...">
                                        </td>
                                    </tr>
                                    <tr id="filaIz">
                                        <th scope="row" data-bs-toggle="tooltip" data-bs-placement="right"
                                            data-bs-title="Corriente Máxima del Cable.">Iz (A)</th>
                                        <td><input type="number" class="form-control form-control-sm" placeholder="...">
                                        </td>
                                    </tr>
                                    <tr id="filaIn">
                                        <th scope="row" data-bs-toggle="tooltip" data-bs-placement="right"
                                            data-bs-title="Corriente PIA.">In (A)</th>
                                        <td><input type="number" class="form-control form-control-sm" placeholder="...">
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
